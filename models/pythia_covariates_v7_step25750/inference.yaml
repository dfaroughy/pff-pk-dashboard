# Inference architecture shared with step 11500; verify against downloaded checkpoint.
data:
  corpus: ${PFFF_CORPUS}
task:
  concentration_normalization: measure_consistent_standardized_log
  covariate_encoding: semantic_generic_v1
model:
  hidden_dimension: 384
  observation_layers: 4
  summary_layers: 1
  cohort_layers: 4
  decoder_layers: 4
  attention_heads: 6
  summary_tokens: 4
  dropout: 0.0
  fourier_modes: 32
  time_fourier_max_frequency: 128
  source: gaussian_process
  source_kernel: matern32
  source_length_scale: 0.1
  source_variance: 1.0
  source_jitter: 1.0e-06
  source_scale: fixed
  source_context_scale_query_chunk_size: 4
  source_context_scale_floor: 0.1
  source_context_scale_ceiling: 10.0
  source_mean: context_kernel
  source_mean_scale: 1.0
  source_mean_kernel: matern32
  source_mean_bandwidth: 0.1
  source_mean_ramp_steps: 2000
  integration_method: euler
  integration_steps: 50
  attention_query_chunk_size: 16
  protocol_encoding: causal_event_operator_v1
  protocol_memory_scales: [0.02, 0.1, 0.5]
  covariate_encoding: semantic_generic_v1
  censoring_encoding: left_censoring_v1
  patient_embedding: shared_mlp_v1
  pk_time_embedding: fourier_v1
  pk_time_frequencies: 16
  pk_time_max_frequency: 128.0
