name: Check and deploy dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/empirical/package-lock.json
      - run: npm ci --prefix apps/empirical
      - run: npm --prefix apps/empirical audit --audit-level=high
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: checked-site
          path: dist
          include-hidden-files: true

  services:
    # Never expose private model source to code submitted from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dashboard
      - uses: astral-sh/setup-uv@v6
      - name: Fetch verified deployed scientific sources
        run: python3 dashboard/scripts/fetch-space-release.py /tmp/deployed-space
      - name: Test the locked Linux CPU Space runtime
        run: |
          python3 dashboard/services/huggingface_space/build_bundle.py --pff-repo /tmp/deployed-space --synthetic-repo /tmp/deployed-space --output /tmp/space-bundle
          uv venv --python 3.12 /tmp/space-runtime
          # Match the lockfile's resolution across the trusted PyPI and PyTorch indexes.
          uv pip install --index-strategy unsafe-best-match --python /tmp/space-runtime/bin/python -r /tmp/space-bundle/requirements.txt
          cd dashboard
          PFF_PYTHON=/tmp/space-runtime/bin/python PFF_REPO=/tmp/space-bundle npm run test:services
      - name: Record tested service release
        run: cat dashboard/services/huggingface_space/release.json

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, services]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
